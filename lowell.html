function cameraWindow(item,parent){const el=document.createElement('article');el.className='cam';el.id=item.id;el.append(createMedia(item));const meta=document.createElement('div');meta.className='cam-meta';meta.innerHTML='<div><div class="cam-title"></div><div class="cam-place"></div></div><span class="status">Live feed</span>';meta.querySelector('.cam-title').textContent=item.title+' ↗';meta.querySelector('.cam-place').textContent=item.place;el.append(meta);activate(el,item);$(parent).append(el);item.element=el;}
cameras.forEach((c,i)=>cameraWindow(c,i<3?'leftRail':'rightRail'));broadcasts.forEach(c=>cameraWindow(c,'tv'));
weather.forEach(item=>{const el=document.createElement('article');el.className='weather-window';el.id=item.id;const media=createMedia(item);el.append(media);const label=document.createElement('div');label.className='window-label';const name=document.createElement('b');name.textContent=item.title+' ↗';const place=document.createElement('span');place.textContent=item.place;label.append(name,place);const state=document.createElement('div');state.className='window-status';state.textContent='Loading NOAA…';state.setAttribute('role','status');el.append(label,state);activate(el,item);$('weather').append(el);item.element=el;media.addEventListener(item.kind==='video'?'loadeddata':'load',()=>status(item,'NOAA · Auto-refresh 10 min'));media.addEventListener('error',()=>showError(item));if(item.kind==='image'&&media.complete&&media.naturalWidth)status(item,'NOAA · Auto-refresh 10 min');});
function status(item,text){item.element?.querySelector('.window-status')?.replaceChildren(document.createTextNode(text));}
function showError(item){status(item,'Unavailable — open source or retry');item.element?.querySelector('.window-status')?.classList.add('error');const panel=panels.get(item.id);if(panel)panel.note.textContent='Source unavailable. Try the original source link.';}
function fitPanel(panel){const r=panel.el.getBoundingClientRect(),w=Math.min(r.width,innerWidth-16),h=Math.min(r.height,innerHeight-16);Object.assign(panel.el.style,{width:w+'px',height:h+'px',left:Math.max(8,Math.min(r.left,innerWidth-w-8))+'px',top:Math.max(8,Math.min(r.top,innerHeight-h-8))+'px'});}
function closePanel(panel){panel.player?.destroy?.();panel.player?.dispose?.();panel.el.remove();panels.delete(panel.item.id);panel.opener.focus({preventScroll:true});}
function openModal(item,opener){
 selectedView=numberedViews.indexOf(item);
 if(panels.has(item.id)){const p=panels.get(item.id);p.el.style.zIndex=++windowZ;p.head.focus();return;}
 const el=document.createElement('section');el.className='floating-window';el.setAttribute('role','dialog');el.setAttribute('aria-label',item.title);
 el.innerHTML='<div class="window-head" tabindex="0"><b></b><div class="window-actions"><button class="audio-toggle" disabled>Audio…</button><button class="size-toggle" aria-label="Maximize window" title="Maximize or restore">⤢</button><button class="window-close" aria-label="Close window" title="Close">×</button></div></div><div class="floating-media"></div><div class="window-foot"><span></span><a target="_blank" rel="noopener">Source ↗</a></div><button class="resize-handle" aria-label="Resize window" title="Drag to resize, or use arrow keys">◢</button>';
 const head=el.querySelector('.window-head'),mediaBox=el.querySelector('.floating-media'),audio=el.querySelector('.audio-toggle'),note=el.querySelector('.window-foot span');
 head.querySelector('b').textContent=item.number+' · '+item.title;head.setAttribute('aria-label',item.number+'. '+item.title+'. Left or right to cycle; Shift plus arrows to move.');el.querySelector('a').href=item.source;
 const panel={el,head,item,opener,note,muted:true};panels.set(item.id,panel);$('windows').append(el);
 const width=Math.min(innerWidth-24,960),height=Math.min(innerHeight-24,640),offset=(panels.size-1)%5*24;
 Object.assign(el.style,{width:width+'px',height:height+'px',left:Math.max(8,(innerWidth-width)/2+offset)+'px',top:Math.max(8,(innerHeight-height)/2+offset)+'px',zIndex:++windowZ});fitPanel(panel);
 const media=createMedia(item,true);mediaBox.append(media);panel.media=media;
 const labelAudio=()=>{audio.textContent=panel.muted?'Unmute':'Mute';audio.setAttribute('aria-label',(panel.muted?'Unmute ':'Mute ')+item.title);audio.setAttribute('aria-pressed',String(!panel.muted));};labelAudio();
 audio.onclick=()=>{panel.muted=!panel.muted;if(item.youtube){panel.muted?panel.player.mute():panel.player.unMute();}else if(panel.player){panel.muted?panel.player.muteOn():panel.player.muteOff();}else{media.muted=panel.muted;}labelAudio();};
 if(item.kind==='image'||item.kind==='video'){audio.hidden=true;note.textContent=item.kind==='image'?'NOAA · Issue time on graphic':'NOAA · Satellite animation (no audio)';}
 else if(item.youtube){note.textContent='';youtubeAPI().then(()=>{if(!el.isConnected)return;panel.player=new YT.Player(media,{events:{onReady:()=>{panel.player.mute();audio.disabled=false;},onError:()=>{note.textContent='Use player controls or open source';}}});}).catch(()=>{note.textContent='Use the player’s volume control';audio.hidden=true;});}
 else {
  note.textContent='';dacastReady ||= loadPlayer('https://prod-player.dacast.com/js/player.js',()=>typeof window.dacast==='function');
  dacastReady.then(()=>{if(!el.isConnected)return;const mount=document.createElement('div');mount.id='dacast-expanded-'+item.id;mount.style.cssText='width:100%;height:100%';mediaBox.replaceChildren(mount);panel.player=window.dacast('41f4cb2177aceea6b7d20c1f8179c161-live-27d3f3cef1d5f598a98344b9a8111c49',mount.id,{width:'100%',height:'100%'});panel.player.onReady(()=>{if(!el.isConnected)return;panel.player.muteOn();panel.player.play();audio.disabled=false;});}).catch(()=>{mediaBox.replaceChildren(media);note.textContent='Use the player’s volume control';audio.hidden=true;});
 }
 el.onpointerdown=()=>{selectedView=numberedViews.indexOf(item);el.style.zIndex=++windowZ;};el.addEventListener('focusin',()=>{selectedView=numberedViews.indexOf(item);});el.querySelector('.window-close').onclick=()=>closePanel(panel);
 el.querySelector('.size-toggle').onclick=()=>{if(panel.saved){Object.assign(el.style,panel.saved);panel.saved=null;fitPanel(panel);}else{panel.saved={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};Object.assign(el.style,{left:'8px',top:'8px',width:(innerWidth-16)+'px',height:(innerHeight-16)+'px'});}el.querySelector('.size-toggle').setAttribute('aria-label',panel.saved?'Restore window':'Maximize window');};
 function gesture(handle,resize){handle.onpointerdown=e=>{if(e.button!==0||(!resize&&e.target.closest('button,a')))return;e.preventDefault();handle.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect(),x=e.clientX,y=e.clientY;el.classList.add('manipulating');panel.saved=null;
 const move=e=>{if(resize){el.style.width=Math.max(Math.min(280,innerWidth-16),Math.min(innerWidth-r.left-8,r.width+e.clientX-x))+'px';el.style.height=Math.max(Math.min(220,innerHeight-16),Math.min(innerHeight-r.top-8,r.height+e.clientY-y))+'px';}else{el.style.left=Math.max(8,Math.min(innerWidth-r.width-8,r.left+e.clientX-x))+'px';el.style.top=Math.max(8,Math.min(innerHeight-r.height-8,r.top+e.clientY-y))+'px';}};
 const end=()=>{el.classList.remove('manipulating');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);};
 handle.onkeydown=e=>{if(e.target!==handle||(!resize&&!e.shiftKey)||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();const r=el.getBoundingClientRect(),dx=e.key==='ArrowLeft'?-20:e.key==='ArrowRight'?20:0,dy=e.key==='ArrowUp'?-20:e.key==='ArrowDown'?20:0;if(resize){el.style.width=Math.max(280,r.width+dx)+'px';el.style.height=Math.max(220,r.height+dy)+'px';}else{el.style.left=r.left+dx+'px';el.style.top=r.top+dy+'px';}panel.saved=null;fitPanel(panel);};}
 gesture(head,false);gesture(el.querySelector('.resize-handle'),true);
 el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();closePanel(panel);}});
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const from=opener.getBoundingClientRect(),to=el.getBoundingClientRect();el.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width},${from.height/to.height})`,opacity:.3},{transform:'none',opacity:1}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});}
 head.focus({preventScroll:true});
}
function selectShortcut(key){const item=numberedViews.find(item=>item.number===key.toUpperCase());if(!item)return;const panel=panels.get(item.id);if(panel)closePanel(panel);else openModal(item,item.element);}
function cycleView(direction){
 const index=selectedView<0?(direction>0?0:numberedViews.length-1):(selectedView+direction+numberedViews.length)%numberedViews.length;
 const previous=numberedViews[selectedView],current=previous&&panels.get(previous.id),next=numberedViews[index];
 const geometry=current?{left:current.el.style.left,top:current.el.style.top,width:current.el.style.width,height:current.el.style.height}:null;
 if(current)closePanel(current);
 openModal(next,next.element);
 if(geometry){Object.assign(panels.get(next.id).el.style,geometry);fitPanel(panels.get(next.id));}
}
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.repeat||e.ctrlKey||e.metaKey||e.altKey||(e.shiftKey&&!/^[ab]$/i.test(e.key))||e.target.closest('input,textarea,select,[contenteditable="true"],video,.resize-handle'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycleView(e.key==='ArrowRight'?1:-1);return;}
 if(!/^[1-9ab]$/i.test(e.key))return;
 e.preventDefault();selectShortcut(e.key);
});
window.addEventListener('resize',()=>panels.forEach(fitPanel));
// Refresh direct NOAA assets, never iframe NOAA webpages (which reject framing).
setInterval(()=>weather.forEach(item=>{const media=item.element.querySelector('img,video');item.currentSrc=item.src+'?t='+Date.now();status(item,'Refreshing NOAA…');media.src=item.currentSrc;if(item.kind==='video')media.play().catch(()=>status(item,'Expand to play satellite loop'));if(panels.has(item.id)){const expanded=panels.get(item.id).el.querySelector('img,video');if(expanded){expanded.src=item.currentSrc;if(item.kind==='video')expanded.play().catch(()=>{});}}}),600000);
function drawConnectors(){
 const svg=$('connectors');svg.innerHTML='';if(!map||innerWidth<=900)return;
 const top=document.querySelector('header').getBoundingClientRect().bottom;svg.style.top=top+'px';svg.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight-top}`);
 cameras.filter(c=>c.lat).forEach(c=>{const r=c.element.getBoundingClientRect(),mr=$('map').getBoundingClientRect(),p=map.latLngToContainerPoint([c.lat,c.lng]);if(p.x<0||p.y<0||p.x>mr.width||p.y>mr.height)return;const x2=mr.left+p.x,y2=mr.top-top+p.y,left=r.left<mr.left,x1=left?r.right:r.left,y1=r.top-top+r.height/2,bend=left?Math.min(x1+70,x2-20):Math.max(x1-70,x2+20);svg.innerHTML+=`<path d="M ${x1} ${y1} C ${bend} ${y1}, ${bend} ${y2}, ${x2} ${y2}"/><circle cx="${x2}" cy="${y2}" r="2.2"/>`;});
}
if(window.L){
 map=L.map('map',{zoomControl:false,attributionControl:true,minZoom:9,maxZoom:15,scrollWheelZoom:false}).setView([22.055,-159.50],10);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);L.control.zoom({position:'topright'}).addTo(map);
 const icon=L.divIcon({className:'',html:'<div class="map-pin"></div>',iconSize:[13,13],iconAnchor:[6,6]});
 cameras.filter(c=>c.lat).forEach(c=>L.marker([c.lat,c.lng],{icon,title:c.title,alt:c.title+' camera — approximate location'}).addTo(map).bindTooltip(c.title,{direction:'top',opacity:.9}).on('click',()=>openModal(c,c.element)));
 map.on('move zoom resize',()=>requestAnimationFrame(drawConnectors));new ResizeObserver(()=>{map.invalidateSize();drawConnectors();}).observe(document.querySelector('.center'));window.addEventListener('scroll',()=>requestAnimationFrame(drawConnectors),{passive:true});requestAnimationFrame(drawConnectors);
}else $('map').innerHTML='<p style="padding:80px 20px">Map unavailable. Camera windows remain available.</p>';
</script>
